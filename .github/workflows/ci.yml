name: Build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install
      - name: Upgrade replay memory
        if: ${{ !contains(github.event.head_commit.message, '[replay-bot]') }}
        run: python3 scripts/upgrade-replay-memory.py
      - name: Upgrade replay branches
        if: ${{ !contains(github.event.head_commit.message, '[replay-bot]') }}
        run: python3 scripts/upgrade-replay-branches.py
      - name: Deepen consequences
        if: ${{ !contains(github.event.head_commit.message, '[replay-bot]') }}
        run: python3 scripts/deepen-consequences.py
      - name: Expand story
        if: ${{ !contains(github.event.head_commit.message, '[replay-bot]') }}
        run: python3 scripts/expand-story.py
      - name: Align copy
        if: ${{ !contains(github.event.head_commit.message, '[replay-bot]') }}
        run: python3 scripts/align-copy.py
      - name: Fix replay save persistence
        if: ${{ !contains(github.event.head_commit.message, '[replay-bot]') }}
        run: python3 scripts/fix-replay-save.py
      - name: Productize endings
        if: ${{ !contains(github.event.head_commit.message, '[replay-bot]') }}
        run: python3 scripts/productize-endings.py
      - name: Wire story choices to Mira
        if: ${{ !contains(github.event.head_commit.message, '[replay-bot]') }}
        run: python3 scripts/wire-mira-choice-events.py
      - name: Wire Mira story directives
        if: ${{ !contains(github.event.head_commit.message, '[replay-bot]') }}
        run: python3 scripts/wire-mira-directives.py
      - name: Smoke test
        run: python3 scripts/smoke-test.py
      - name: Build
        run: npm run build
      - name: Commit replay upgrades
        if: ${{ !contains(github.event.head_commit.message, '[replay-bot]') }}
        run: |
          git config user.name "between-us-replay-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.tsx app/mira/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: connect story choices to Mira [replay-bot]"
          git push
