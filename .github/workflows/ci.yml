name: Build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install
      - name: Upgrade replay memory
        if: ${{ !contains(github.event.head_commit.message, '[replay-bot]') }}
        run: python3 scripts/upgrade-replay-memory.py
      - name: Build
        run: npm run build
      - name: Commit replay memory upgrade
        if: ${{ !contains(github.event.head_commit.message, '[replay-bot]') }}
        run: |
          git config user.name "between-us-replay-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: make replay remember first-run choices [replay-bot]"
          git push
